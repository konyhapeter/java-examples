server:
  port: 8090
spring:
  application:
    name: SecurityApp
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/security-demo}

springdoc:
  swagger-ui:
    path: /index.html
    oauth:
      client-id: security-app

management:
  endpoints:
    web:
      exposure:
        include: health
