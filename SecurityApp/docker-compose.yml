services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: keycloak
    entrypoint: [ "/bin/bash", "-c" ]
    command: >
      "/opt/keycloak/bin/kc.sh build --health-enabled=true &&
       /opt/keycloak/bin/kc.sh start --optimized"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true

      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/security-demo-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  security-app:
    build:
      context: ..
      dockerfile: SecurityApp/Dockerfile
    environment:
      OAUTH2_ISSUER_URI: http://localhost:8080/realms/security-demo
    ports:
      - "8090:8090"
    depends_on:
      keycloak:
        condition: service_healthy
