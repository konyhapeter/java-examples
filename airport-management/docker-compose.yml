services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: airport
      POSTGRES_USER: airport
      POSTGRES_PASSWORD: airport
    ports:
      - "5432:5432"
    volumes:
      - airport-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airport -d airport"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: airport-management/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/airport
      SPRING_DATASOURCE_USERNAME: airport
      SPRING_DATASOURCE_PASSWORD: airport
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  airport-postgres-data:
