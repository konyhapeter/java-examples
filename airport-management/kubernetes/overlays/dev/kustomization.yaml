apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: airport-management-dev
resources:
  - ../../base
  - namespace.yaml
  - postgres.yaml
configMapGenerator:
  - name: airport-management-config
    behavior: replace
    literals:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/airport
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: airport-management
    newName: airport-management
    newTag: dev
patches:
  - path: deployment-postgres-wait.yaml
