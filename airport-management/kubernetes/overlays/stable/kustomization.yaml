apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: airport-management-stable
resources:
  - ../../base
  - namespace.yaml
  - pod-disruption-budget.yaml
  - horizontal-pod-autoscaler.yaml
configMapGenerator:
  - name: airport-management-config
    behavior: replace
    literals:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres.stable.example.internal:5432/airport?sslmode=require
generatorOptions:
  disableNameSuffixHash: true
replicas:
  - name: airport-management
    count: 2
images:
  - name: airport-management
    newName: airport-management
    newTag: stable
patches:
  - path: deployment-resources.yaml
